[package]
name = "tetanus"
version = "0.1.0"
edition = "2021"
description = "Zero-dependency local Transformer inference engine in Rust for GGUF models"

# Intentionally zero external crate dependencies: mmap, thread pool, f16, GGUF parsing,
# BPE tokenization, block quantization, and SIMD kernels all live directly in src/.
[dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
